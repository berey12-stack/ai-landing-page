<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Landing Page Generator</title>
  <link rel="stylesheet" href="style-v2.css" />
</head>
<body>

  <!-- Hero / Input -->
  <div class="hero">
    <h1>AI Landing Page Generator</h1>
    <p>Describe your business idea and get a ready-made landing page instantly.</p>

    <div class="input-card">
      <textarea id="businessIdea" placeholder="e.g. A bakery selling vintage pastries in the city centre"></textarea>
      <button id="generateBtn" onclick="generatePage()">Generate Landing Page</button>
    </div>
  </div>

  <!-- Output -->
  <div class="output-section" id="output" style="display:none;">
    <div class="landing-preview">

      <!-- Preview Hero -->
      <div class="preview-hero">
        <h2 id="businessName"></h2>
        <p id="tagline" class="tagline"></p>
        <button class="cta-btn" id="ctaBtn"></button>
      </div>

      <!-- Features -->
      <div class="features">
        <div class="feature-card" id="feature1"></div>
        <div class="feature-card" id="feature2"></div>
        <div class="feature-card" id="feature3"></div>
      </div>

      <!-- Contact -->
      <div class="contact-section">
        <h3>Get in Touch</h3>
        <p>Interested? Send us a message and we'll get back to you shortly.</p>
        <form class="contact-form" onsubmit="handleContact(event)">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" rows="4" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>

    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
